<text x="345" y="753.7" font-size="17" fill="#D2DAE4">FreeRTOS 11.1 (ESP-IDF</text>
<text x="345" y="778.3" font-size="17" fill="#D2DAE4">SMP or vanilla)</text>
<text x="634" y="698.4" font-size="20" font-weight="700" fill="#A7F3E6">os_threadx.h</text>
<text x="634" y="729" font-size="17" fill="#D2DAE4">HF_RTOS_THREADX</text>
