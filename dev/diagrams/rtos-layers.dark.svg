<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#C7CBFF">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">One API, one backend per scheduler</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">Classes never name a kernel. A compile definition picks the backend; with none, the host backend.</text>
